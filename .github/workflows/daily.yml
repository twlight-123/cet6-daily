name: 每日出题

# 每天北京时间 06:00（UTC 22:00）自动生成当天的套题与每日一文。
# 电脑关着也照跑 —— 这就是"关机也出题"的实现方式。
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:        # 也可以在网页上手动点一次

permissions:
  contents: write           # 需要往仓库里写 out/

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成当天内容
        env:
          TZ: Asia/Shanghai
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python tools/cloud_build.py --force

      - name: 提交结果
        run: |
          git config user.name "cet6-bot"
          git config user.email "cet6-bot@users.noreply.github.com"
          git add -A out
          if git diff --cached --quiet; then
            echo "没有新内容，跳过提交"
          else
            git commit -m "build: $(TZ=Asia/Shanghai date +%F) 每日套题"
            git push
          fi

      - name: 失败提示
        if: failure()
        run: |
          echo "::error::今天的题没生成出来，请查看上面的日志。"
